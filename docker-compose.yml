services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: logpulse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: logpulse
      MINIO_ROOT_PASSWORD: logpulse-dev-password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data: