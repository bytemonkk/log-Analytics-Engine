readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "minio>=7.2.20",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = true
